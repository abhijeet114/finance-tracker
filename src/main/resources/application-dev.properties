# Development profile with PostgreSQL database
spring.application.name=tracker

# PostgreSQL Database Configuration (for development)
spring.datasource.url=jdbc:postgresql://localhost:5432/finance_tracker
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=finance_user
spring.datasource.password=finance_password

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,beans
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.finance.tracker=DEBUG
logging.level.org.springframework.web=DEBUG
