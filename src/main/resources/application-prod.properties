# Production profile configuration
spring.application.name=tracker

# Database Configuration for Production
spring.datasource.url=jdbc:postgresql://localhost:5432/finance_tracker
spring.datasource.username=finance_user
spring.datasource.password=finance_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.finance.tracker=INFO
logging.level.sql=WARN
logging.level.org.hibernate.SQL=WARN

# JWT Configuration
app.jwt.secret=${JWT_SECRET:myVerySecureJwtSecretKeyThatIsAtLeast32CharactersLong}
app.jwt.expiration=${JWT_EXPIRATION:86400}
