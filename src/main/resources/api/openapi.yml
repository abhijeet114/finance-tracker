openapi: 3.0.3
info:
  title: Finance Tracker API
  description: API for tracking personal finances
  version: 1.0.0
tags:
  - name: Transactions
    description: Operations about financial transactions
servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /transactions:
    get:
      tags:
        - Transactions
      summary: Get all transactions
      operationId: getAllTransactions
      responses:
        '200':
          description: List of transactions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '500':
          description: Internal server error
    
    post:
      tags:
        - Transactions
      summary: Create a new transaction
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transaction'
      responses:
        '201':
          description: Transaction created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Invalid input
        '500':
          description: Internal server error

  /transactions/{id}:
    get:
      tags:
        - Transactions
      summary: Get transaction by ID
      operationId: getTransactionById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Transaction found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          description: Transaction not found
        '500':
          description: Internal server error
    
    put:
      tags:
        - Transactions
      summary: Update transaction
      operationId: updateTransaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transaction'
      responses:
        '200':
          description: Transaction updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          description: Transaction not found
        '500':
          description: Internal server error
    
    delete:
      tags:
        - Transactions
      summary: Delete transaction
      operationId: deleteTransaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Transaction deleted successfully
        '404':
          description: Transaction not found
        '500':
          description: Internal server error

components:
  schemas:
    Transaction:
      type: object
      required:
        - amount
        - type
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        amount:
          type: number
          format: double
          description: Transaction amount
        type:
          type: string
          enum: [INCOME, EXPENSE]
          description: Type of transaction
        category:
          type: string
          description: Transaction category
        description:
          type: string
          description: Transaction description
        dateTime:
          type: string
          format: date-time
          description: Transaction date and time
