spring.application.name=tracker

# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/finance_tracker
spring.datasource.username=finance_user
spring.datasource.password=finance_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,env,loggers,beans
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always

# JWT Configuration
app.jwt.secret=myVerySecureJwtSecretKeyThatIsAtLeast32CharactersLong
app.jwt.expiration=86400
