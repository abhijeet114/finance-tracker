openapi: 3.0.3
info:
  title: Finance Tracker API
  description: API for tracking personal finances with JWT authentication
  version: 1.0.0
tags:
  - name: Authentication
    description: User authentication and registration
  - name: User
    description: User profile operations
  - name: Transactions
    description: Operations about financial transactions
servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  # Authentication endpoints
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      operationId: registerUser
      security: []  # Override global security - no auth required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Registration failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      operationId: loginUser
      security: []  # Override global security - no auth required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
          
  # User endpoints
  /api/user/profile:
    get:
      tags:
        - User
      summary: Get user profile
      operationId: getUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/transactions:
    get:
      tags:
        - Transactions
      summary: Get all transactions
      operationId: getAllTransactions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of transactions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    
    post:
      tags:
        - Transactions
      summary: Create a new transaction
      operationId: createTransaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      responses:
        '201':
          description: Transaction created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/transactions/{id}:
    get:
      tags:
        - Transactions
      summary: Get transaction by ID
      operationId: getTransactionById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transaction found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    
    put:
      tags:
        - Transactions
      summary: Update transaction
      operationId: updateTransaction
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      responses:
        '200':
          description: Transaction updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    
    delete:
      tags:
        - Transactions
      summary: Delete transaction
      operationId: deleteTransaction
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Transaction deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

components:
  schemas:
    # Universal API Response schema for ALL endpoints
    ApiResponse:
      type: object
      required:
        - status
        - timestamp
        - path
      properties:
        status:
          type: integer
          description: HTTP status code
          example: 200
        error:
          type: string
          description: Error type (empty string for success responses, error type for failures)
          example: ""
        message:
          type: string
          description: Response message
          example: "Success"
        path:
          type: string
          description: API endpoint path
          example: "/api/auth/login"
        body:
          type: object
          description: Response data (populated for success, null for errors)
          nullable: true
        timestamp:
          type: string
          format: date-time
          description: Response timestamp
          example: "2025-08-07T10:57:12.072"

    # Data schemas (used within the body field)
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT access token
        type:
          type: string
          default: "Bearer"
          description: Token type
        username:
          type: string
          description: Username
        email:
          type: string
          description: User email

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: User ID
        username:
          type: string
          description: Username
        email:
          type: string
          description: User email
        role:
          type: string
          enum: [USER, ADMIN]
          description: User role
        createdAt:
          type: string
          format: date-time
          description: Account creation timestamp

    TransactionRequest:
      type: object
      required:
        - amount
        - type
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Transaction ID
        amount:
          type: number
          format: double
          description: Transaction amount
        type:
          type: string
          enum: [INCOME, EXPENSE]
          description: Transaction type
        category:
          type: string
          description: Transaction category
        description:
          type: string
          description: Transaction description
        dateTime:
          type: string
          format: date-time
          description: Transaction date and time

    TransactionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Transaction ID
        amount:
          type: number
          format: double
          description: Transaction amount
        type:
          type: string
          enum: [INCOME, EXPENSE]
          description: Transaction type
        category:
          type: string
          description: Transaction category
        description:
          type: string
          description: Transaction description
        dateTime:
          type: string
          format: date-time
          description: Transaction date and time

    # Authentication request DTOs
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          description: Unique username
        email:
          type: string
          format: email
          description: User email address
        password:
          type: string
          description: User password
          
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Username
        password:
          type: string
          description: User password

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

# Apply security to all transaction endpoints
security:
  - bearerAuth: []
