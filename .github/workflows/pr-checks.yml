name: Pull Request Checks

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  # Check if PR should trigger CI based on file changes
  check-changes:
    name: Check Changed Files
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.changes.outputs.backend }}
      frontend-changed: ${{ steps.changes.outputs.frontend }}
      docs-changed: ${{ steps.changes.outputs.docs }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check for changes
      uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          backend:
            - 'backend/**'
            - 'docker-compose.yml'
            - '.github/workflows/**'
          frontend:
            - 'frontend/**'
            - '.github/workflows/**'
          docs:
            - 'docs/**'
            - '*.md'

  # Backend specific checks
  backend-pr-checks:
    name: Backend PR Checks
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.backend-changed == 'true'
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: financedb
          POSTGRES_USER: financeuser
          POSTGRES_PASSWORD: financepass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Validate Maven wrapper
      run: |
        if [ ! -f "./mvnw" ]; then
          echo "Maven wrapper not found!"
          exit 1
        fi

    - name: Check code formatting
      run: |
        ./mvnw spotless:check || {
          echo "Code formatting issues found. Run './mvnw spotless:apply' to fix."
          exit 1
        }

    - name: Run tests with coverage
      run: ./mvnw clean test jacoco:report
      env:
        SPRING_PROFILES_ACTIVE: test

    - name: Check test coverage
      run: |
        ./mvnw jacoco:check || {
          echo "Test coverage below minimum threshold"
          exit 1
        }

    - name: Build application
      run: ./mvnw clean package -DskipTests

    - name: Comment PR with test results
      uses: actions/github-script@v7
      if: always()
      with:
        script: |
          const fs = require('fs');
          const path = 'backend/target/site/jacoco/index.html';
          
          if (fs.existsSync(path)) {
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Backend tests completed. Check the artifacts for coverage report.'
            });
          }

  # Frontend specific checks
  frontend-pr-checks:
    name: Frontend PR Checks
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.frontend-changed == 'true'
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js 22.12.0
      uses: actions/setup-node@v4
      with:
        node-version: '22.12.0'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Check for security vulnerabilities
      run: npm audit --audit-level=moderate

    - name: Type check
      run: npx tsc --noEmit

    - name: Run ESLint
      run: npm run lint

    - name: Check code formatting
      run: npx prettier --check "src/**/*.{ts,tsx,js,jsx,json,css,scss,md}"

    - name: Build application
      run: npm run build

    - name: Check bundle size
      run: |
        if [ -d ".next" ]; then
          echo "Bundle analysis:"
          du -sh .next/*
        fi

    - name: Comment PR with build results
      uses: actions/github-script@v7
      if: always()
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Frontend build completed successfully.'
          });

  # Integration tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [check-changes, backend-pr-checks, frontend-pr-checks]
    if: |
      always() && 
      (needs.check-changes.outputs.backend-changed == 'true' || 
       needs.check-changes.outputs.frontend-changed == 'true')

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: financedb
          POSTGRES_USER: financeuser
          POSTGRES_PASSWORD: financepass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Start backend
      working-directory: ./backend
      run: |
        ./mvnw spring-boot:run -Dspring-boot.run.profiles=test &
        echo $! > backend.pid
        
        # Wait for backend to start
        for i in {1..30}; do
          if curl -f http://localhost:8080/actuator/health 2>/dev/null; then
            echo "Backend started successfully"
            break
          fi
          echo "Waiting for backend to start... ($i/30)"
          sleep 5
        done

    - name: Run API tests
      run: |
        # Add your API integration tests here
        echo "Running API integration tests..."
        curl -f http://localhost:8080/actuator/health || exit 1

    - name: Stop backend
      if: always()
      run: |
        if [ -f backend.pid ]; then
          kill $(cat backend.pid) || true
          rm backend.pid
        fi

  # Summary job
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [check-changes, backend-pr-checks, frontend-pr-checks, integration-tests]
    if: always()

    steps:
    - name: Generate summary
      uses: actions/github-script@v7
      with:
        script: |
          const backendChanged = '${{ needs.check-changes.outputs.backend-changed }}';
          const frontendChanged = '${{ needs.check-changes.outputs.frontend-changed }}';
          const backendResult = '${{ needs.backend-pr-checks.result }}';
          const frontendResult = '${{ needs.frontend-pr-checks.result }}';
          const integrationResult = '${{ needs.integration-tests.result }}';
          
          let summary = '## PR Check Summary\n\n';
          
          if (backendChanged === 'true') {
            summary += `- Backend checks: ${backendResult === 'success' ? '✅' : '❌'}\n`;
          } else {
            summary += '- Backend: No changes detected\n';
          }
          
          if (frontendChanged === 'true') {
            summary += `- Frontend checks: ${frontendResult === 'success' ? '✅' : '❌'}\n`;
          } else {
            summary += '- Frontend: No changes detected\n';
          }
          
          if (backendChanged === 'true' || frontendChanged === 'true') {
            summary += `- Integration tests: ${integrationResult === 'success' ? '✅' : '❌'}\n`;
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });
