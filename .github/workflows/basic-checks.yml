name: Basic Checks

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  basic-validation:
    name: Basic Project Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check project structure
      run: |
        echo "Checking project structure..."
        
        # Check if required directories exist
        if [ ! -d "backend" ]; then
          echo "❌ Backend directory not found"
          exit 1
        fi
        
        if [ ! -d "frontend" ]; then
          echo "❌ Frontend directory not found"
          exit 1
        fi
        
        # Check if required files exist
        if [ ! -f "backend/pom.xml" ]; then
          echo "❌ Backend pom.xml not found"
          exit 1
        fi
        
        if [ ! -f "frontend/package.json" ]; then
          echo "❌ Frontend package.json not found"
          exit 1
        fi
        
        if [ ! -f "docker-compose.yml" ]; then
          echo "❌ docker-compose.yml not found"
          exit 1
        fi
        
        echo "✅ All required files and directories found"

    - name: Validate docker-compose
      run: |
        if command -v docker-compose &> /dev/null; then
          docker-compose config
          echo "✅ docker-compose.yml is valid"
        else
          echo "⚠️ docker-compose not available, skipping validation"
        fi

    - name: Check file permissions
      run: |
        if [ ! -x "backend/mvnw" ]; then
          echo "❌ Maven wrapper is not executable"
          chmod +x backend/mvnw
          echo "✅ Fixed Maven wrapper permissions"
        fi

    - name: Validate Maven project
      run: |
        cd backend
        ./mvnw help:effective-pom -q
        echo "✅ Maven project is valid"

    - name: Validate Node.js project
      run: |
        cd frontend
        if [ -f "package-lock.json" ]; then
          npm ci --dry-run
        else
          npm install --dry-run
        fi
        echo "✅ Node.js project dependencies are valid"

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install markdownlint
      run: npm install -g markdownlint-cli

    - name: Lint markdown files
      run: |
        markdownlint README.md || echo "⚠️ README.md has formatting issues"
        markdownlint docs/**/*.md || echo "⚠️ Documentation has formatting issues"

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install yamllint
      run: pip install yamllint

    - name: Lint YAML files
      run: |
        yamllint .github/workflows/ || echo "⚠️ Workflow files have formatting issues"
        yamllint docker-compose.yml || echo "⚠️ docker-compose.yml has formatting issues"
